services:
  postgres:
    image: postgres:16-alpine
    container_name: launchkit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: launchkit
      POSTGRES_PASSWORD: launchkit
      POSTGRES_DB: launchkit
    ports:
      - "5432:5432"
    volumes:
      - launchkit-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchkit -d launchkit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  launchkit-postgres:
